spring:
  application:
    name: claim-application
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/sign_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${CLAIM_DB_USERNAME:claim}
    password: ${CLAIM_DB_PASSWORD:claim-local-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8081}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

otel:
  sdk:
    disabled: true
