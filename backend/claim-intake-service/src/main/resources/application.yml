spring:
  application:
    name: claim-intake-service
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/claim_intake_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${CLAIM_DB_USERNAME:claim}
    password: ${CLAIM_DB_PASSWORD:claim-local-password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

claim:
  internal:
    service-token: ${CLAIM_INTERNAL_SERVICE_TOKEN:change-me-in-non-local-environments}
  intake:
    submission:
      lock:
        wait-time: ${CLAIM_INTAKE_LOCK_WAIT_TIME:3s}
        lease-time: ${CLAIM_INTAKE_LOCK_LEASE_TIME:10s}
        key-prefix: "${CLAIM_INTAKE_LOCK_KEY_PREFIX:claim:intake:submit:}"
      replay-cache:
        key-prefix: "${CLAIM_INTAKE_REPLAY_CACHE_KEY_PREFIX:claim:intake:replay:}"
        ttl: ${CLAIM_INTAKE_REPLAY_CACHE_TTL:24h}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

otel:
  sdk:
    disabled: true
