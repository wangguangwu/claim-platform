name: claim-platform

services:
  mysql:
    image: mysql:8.0
    profiles: [infra, app]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
      MYSQL_USER: ${MYSQL_USER:-claim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-claim-local-only}
      MYSQL_DATABASE: platform_bootstrap
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    profiles: [infra, app]
    ports: ["${REDIS_HOST_PORT:-6380}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    profiles: [infra, app]
    command: sh mqnamesrv
    ports: ["${ROCKETMQ_NAMESRV_PORT:-9876}:9876"]
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    profiles: [infra, app]
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876
    ports: ["${ROCKETMQ_BROKER_PORT:-10911}:10911"]
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: nacos/nacos-server:v2.3.2
    profiles: [infra, app]
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports: ["${NACOS_PORT:-8848}:8848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.2
    profiles: [infra, app]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false
        --spring.datasource.username=${MYSQL_USER:-claim}
        --spring.datasource.password=${MYSQL_PASSWORD:-claim-local-only}
    ports: ["${XXL_JOB_PORT:-8088}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 20

  claim-gateway:
    profiles: [app]
    build:
      context: .
      dockerfile: claim-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      SIGN_SERVICE_URL: http://claim-sign-service:8081
      PUSH_SERVICE_URL: http://claim-case-push-service:8082
    depends_on:
      nacos: { condition: service_healthy }
      redis: { condition: service_healthy }
      claim-sign-service: { condition: service_healthy }
      claim-case-push-service: { condition: service_healthy }
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  claim-sign-service:
    profiles: [app]
    build:
      context: .
      dockerfile: claim-sign-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      SIGN_DB_URL: jdbc:mysql://mysql:3306/claim_sign_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-claim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-claim-local-only}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  claim-case-push-service:
    profiles: [app]
    build:
      context: .
      dockerfile: claim-case-push-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      PUSH_DB_URL: jdbc:mysql://mysql:3306/claim_push_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-claim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-claim-local-only}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
  redis-data:
