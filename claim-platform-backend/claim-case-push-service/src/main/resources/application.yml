spring:
  application:
    name: claim-case-push-service
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/push_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${CLAIM_DB_USERNAME:claim}
    password: ${CLAIM_DB_PASSWORD:claim-local-password}
server:
  port: ${SERVER_PORT:8082}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

otel:
  sdk:
    disabled: true
