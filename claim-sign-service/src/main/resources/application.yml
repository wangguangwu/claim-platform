server:
  port: ${SERVER_PORT:8081}
spring:
  application.name: claim-sign-service
  config.import: optional:nacos:application.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud.nacos.config.server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  datasource:
    url: ${SIGN_DB_URL:jdbc:mysql://localhost:3306/claim_sign_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:claim}
    password: ${MYSQL_PASSWORD:claim-local-only}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
  health.nacos.enabled: false
logging.pattern.level: '%5p [traceId=%X{traceId:-}]'
